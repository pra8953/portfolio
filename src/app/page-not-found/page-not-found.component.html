<div class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 flex flex-col items-center justify-center px-4 sm:px-6">
  <div class="max-w-md w-full space-y-8 text-center">
    <!-- Animated 404 text -->
    <div class="relative">
      <h1 class="text-9xl font-extrabold text-gray-900 mb-4 relative">
        <span class="bg-clip-text text-transparent bg-gradient-to-r from-red-500 to-red-600">404</span>
        <span class="absolute -top-4 -right-4 text-red-500 text-5xl animate-pulse">!</span>
      </h1>
      <div class="absolute -inset-4 bg-red-100 rounded-full opacity-0 group-hover:opacity-100 blur-md transition-opacity duration-300"></div>
    </div>

    <!-- Message -->
    <h2 class="mt-6 text-3xl font-extrabold text-gray-900">
      Oops! Page not found
    </h2>
    <p class="mt-4 text-lg text-gray-600">
      The page you're looking for doesn't exist or has been moved.
    </p>

    <!-- Action buttons -->
    <div class="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4">
      <a 
        routerLink="/"
        class="w-full sm:w-auto px-6 py-3 border border-transparent text-base font-medium rounded-md text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-all duration-200 shadow-lg hover:shadow-xl transform hover:-translate-y-1"
      >
        Go back home
      </a>
      <a 
        href="#"
        class="w-full sm:w-auto px-6 py-3 border border-transparent text-base font-medium rounded-md text-red-700 bg-red-100 hover:bg-red-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-all duration-200 shadow hover:shadow-md"
      >
        Contact support
      </a>
    </div>

    <!-- Search bar (optional) -->
    <div class="mt-12 max-w-xs mx-auto">
      <div class="relative">
        <input 
          type="text" 
          placeholder="Search..." 
          class="w-full px-4 py-2 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all duration-200"
        >
        <button class="absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-red-500 transition-colors duration-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Decorative elements -->
  <div class="absolute bottom-10 left-10 w-20 h-20 rounded-full bg-red-200 opacity-20 blur-xl"></div>
  <div class="absolute top-20 right-20 w-32 h-32 rounded-full bg-red-100 opacity-30 blur-xl"></div>
  <div class="absolute top-1/3 left-1/4 w-16 h-16 rounded-full bg-red-50 opacity-40 blur-lg"></div>
</div>
