<div class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 py-12 px-6 md:px-12 lg:px-24 flex items-center justify-center">
  <div class="w-full max-w-2xl">
    <!-- Contact Form Container -->
    <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-100 transform transition-all duration-500 hover:shadow-xl">
      <!-- Form Header with animated underline -->
      <div class="bg-gradient-to-r from-blue-600 to-blue-700 p-8 text-center">
        <h2 class="text-3xl md:text-4xl font-bold text-white relative inline-block pb-2">
          Contact <span class="text-white">Us</span>
          <span class="absolute bottom-0 left-1/2 transform -translate-x-1/2 w-16 h-1 bg-white rounded-full"></span>
        </h2>
        <p class="mt-3 text-blue-100">Get in touch directly via WhatsApp</p>
      </div>

      <!-- Form Content -->
      <div class="p-8 md:p-10">
        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="space-y-6">
          <!-- Name Field -->
          <div class="group">
            <label for="name" class="block text-sm font-medium text-gray-700 mb-1 transition-all duration-300 group-hover:text-blue-600">
              Name <span class="text-red-600">*</span>
            </label>
            <div class="relative">
              <input 
                type="text" 
                id="name" 
                formControlName="name" 
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
                placeholder="Your full name">
              <div *ngIf="submitted && contactForm.controls['name'].errors" 
                   class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-red-600" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                </svg>
              </div>
            </div>
            <div *ngIf="submitted && contactForm.controls['name'].errors" class="text-red-600 text-sm mt-1 animate-fadeIn">
              Please enter your name
            </div>
          </div>

          <!-- Phone and Email Row -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Phone Field -->
            <div class="group">
              <label for="phone" class="block text-sm font-medium text-gray-700 mb-1 transition-all duration-300 group-hover:text-blue-600">
                Phone <span class="text-red-600">*</span>
              </label>
              <div class="relative">
                <input 
                  type="tel" 
                  id="phone" 
                  formControlName="phone" 
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
                  placeholder="Your phone number">
                <div *ngIf="submitted && contactForm.controls['phone'].errors" 
                     class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                  <svg class="h-5 w-5 text-red-600" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                  </svg>
                </div>
              </div>
              <div *ngIf="submitted && contactForm.controls['phone'].errors" class="text-red-600 text-sm mt-1 animate-fadeIn">
                Valid 10-digit number required
              </div>
            </div>

            <!-- Email Field -->
            <div class="group">
              <label for="email" class="block text-sm font-medium text-gray-700 mb-1 transition-all duration-300 group-hover:text-blue-600">
                Email <span class="text-red-600">*</span>
              </label>
              <div class="relative">
                <input 
                  type="email" 
                  id="email" 
                  formControlName="email" 
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
                  placeholder="Your email address">
                <div *ngIf="submitted && contactForm.controls['email'].errors" 
                     class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                  <svg class="h-5 w-5 text-red-600" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                  </svg>
                </div>
              </div>
              <div *ngIf="submitted && contactForm.controls['email'].errors" class="text-red-600 text-sm mt-1 animate-fadeIn">
                Valid email required
              </div>
            </div>
          </div>

          <!-- Work Type Field -->
          <div class="group">
            <label for="workType" class="block text-sm font-medium text-gray-700 mb-1 transition-all duration-300 group-hover:text-blue-600">
              Work Type <span class="text-red-600">*</span>
            </label>
            <div class="relative">
              <select 
                id="workType" 
                formControlName="workType" 
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent appearance-none transition-all duration-300 bg-white bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIGZpbGw9Im5vbmUiIHZpZXdCb3g9IjAgMCAyNCAyNCIgc3Ryb2tlPSJjdXJyZW50Q29sb3IiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIiBjbGFzcz0ibHVjaWRlIGx1Y2lkZS1jaGV2cm9ucy11cC1kb3duIj48cGF0aCBkPSJtNyAxNSA1IDUgNS01Ii8+PHBhdGggZD0ibTcgOSA1LTUgNSA1Ii8+PC9zdmc+')] bg-no-repeat bg-[center_right_1rem]">
                <option value="" disabled selected>Select work type</option>
                <option value="Freelance">Freelance</option>
                <option value="Full-time">Full-time</option>
                <option value="Part-time">Part-time</option>
                <option value="Contract">Contract</option>
                <option value="Other">Other</option>
              </select>
              <div *ngIf="submitted && contactForm.controls['workType'].errors" 
                   class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-red-600" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                </svg>
              </div>
            </div>
            <div *ngIf="submitted && contactForm.controls['workType'].errors" class="text-red-600 text-sm mt-1 animate-fadeIn">
              Please select work type
            </div>
          </div>

          <!-- Description Field -->
          <div class="group">
            <label for="description" class="block text-sm font-medium text-gray-700 mb-1 transition-all duration-300 group-hover:text-blue-600">
              Description <span class="text-gray-500">(Optional)</span>
            </label>
            <textarea 
              id="description" 
              formControlName="description" 
              rows="4" 
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
              placeholder="Tell us about your project..."></textarea>
          </div>

          <!-- Submit Button -->
          <div class="pt-4">
            <button 
              type="submit" 
              class="w-full px-6 py-4 bg-gradient-to-r from-blue-600 to-blue-700 text-white font-medium rounded-lg shadow-md hover:shadow-lg transition-all duration-300 hover:from-blue-700 hover:to-blue-800 flex items-center justify-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.479 5.092 1.479 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
              </svg>
              Send via WhatsApp
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
