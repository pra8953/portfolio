<div class="flex min-h-screen">
  <!-- Sidebar that becomes hidden on small screens -->
  <div class="w-64 h-screen fixed top-0 left-0 bg-white shadow-md z-50 hidden lg:block">
    <app-sidebar></app-sidebar>
  </div>

  <!-- Mobile navbar that appears on small screens -->
<nav class="lg:hidden fixed top-0 left-0 right-0 bg-white shadow-md z-50 p-4 transition-all duration-300">
  <div class="flex justify-between items-center">
    <!-- Logo -->
    <div class="text-xl font-bold text-gray-800 group">
      <span class="text-red-500 transition-transform duration-300 group-hover:rotate-12 inline-block">⎿</span>
      <span class="bg-clip-text text-transparent bg-gradient-to-r from-red-500 to-red-600">Prashant</span>
      <span class="text-red-500 transition-transform duration-300 group-hover:-rotate-12 inline-block">⏋</span>
    </div>
    
    <!-- Mobile menu button with animated hamburger -->
    <button (click)="toggleMobileMenu()" class="text-gray-600 hover:text-red-500 focus:outline-none transition-all duration-300">
      <div class="relative w-6 h-6">
        <!-- Top bar -->
        <span class="absolute left-0 top-1 w-full h-0.5 bg-current transition-all duration-300"
              [class]="mobileMenuOpen ? 'rotate-45 top-[11px]' : ''"></span>
        <!-- Middle bar -->
        <span class="absolute left-0 top-[11px] w-full h-0.5 bg-current transition-all duration-300"
              [class]="mobileMenuOpen ? 'opacity-0' : ''"></span>
        <!-- Bottom bar -->
        <span class="absolute left-0 top-5 w-full h-0.5 bg-current transition-all duration-300"
              [class]="mobileMenuOpen ? '-rotate-45 top-[11px]' : ''"></span>
      </div>
    </button>
  </div>
  
  <!-- Mobile menu items with slide-down animation -->
  <div *ngIf="mobileMenuOpen" @slideInOut class="mt-4 space-y-2 origin-top">
    <a routerLink="" (click)="mobileMenuOpen = false" 
       class="block px-4 py-3 rounded-lg text-gray-600 font-medium hover:bg-red-100 hover:text-red-600 transition-all duration-200 hover:translate-x-1"
       routerLinkActive="bg-red-100 text-red-600" [routerLinkActiveOptions]="{ exact: true }">
      <div class="flex items-center space-x-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />
        </svg>
        <span>Home</span>
      </div>
    </a>
    <a routerLink="/about" (click)="mobileMenuOpen = false"
       class="block px-4 py-3 rounded-lg text-gray-600 font-medium hover:bg-red-100 hover:text-red-600 transition-all duration-200 hover:translate-x-1"
       routerLinkActive="bg-red-100 text-red-600">
      <div class="flex items-center space-x-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
        </svg>
        <span>About</span>
      </div>
    </a>
    <a routerLink="/project" (click)="mobileMenuOpen = false"
       class="block px-4 py-3 rounded-lg text-gray-600 font-medium hover:bg-red-100 hover:text-red-600 transition-all duration-200 hover:translate-x-1"
       routerLinkActive="bg-red-100 text-red-600">
      <div class="flex items-center space-x-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M3 5a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2h-2.22l.123.489.804.804A1 1 0 0113 18H7a1 1 0 01-.707-1.707l.804-.804L7.22 15H5a2 2 0 01-2-2V5zm5.771 7H5V5h10v7H8.771z" clip-rule="evenodd" />
        </svg>
        <span>Project</span>
      </div>
    </a>
    <a routerLink="/freelance" (click)="mobileMenuOpen = false"
       class="block px-4 py-3 rounded-lg text-gray-600 font-medium hover:bg-red-100 hover:text-red-600 transition-all duration-200 hover:translate-x-1"
       routerLinkActive="bg-red-100 text-red-600">
      <div class="flex items-center space-x-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 4a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
        </svg>
        <span>Freelance</span>
      </div>
    </a>
    <a routerLink="/contact" (click)="mobileMenuOpen = false"
       class="block px-4 py-3 rounded-lg text-gray-600 font-medium hover:bg-red-100 hover:text-red-600 transition-all duration-200 hover:translate-x-1"
       routerLinkActive="bg-red-100 text-red-600">
      <div class="flex items-center space-x-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" clip-rule="evenodd" />
        </svg>
        <span>Contact</span>
      </div>
    </a>
  </div>
</nav>

  <!-- Scrollable Main Content with left margin that adjusts for mobile -->
  <div class="flex-1 lg:ml-64 pt-16 lg:pt-0">
    <div class="relative">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
