<!-- projects.component.html -->
<div class="min-h-screen bg-white py-16 px-6 md:px-12 lg:px-24">
  <div class="max-w-6xl mx-auto">
    <!-- Premium Header Section -->
    <div class="mb-16 text-center">
      <div class="inline-block relative">
        <h2 class="text-4xl md:text-5xl font-bold text-gray-900 relative z-10">
          My <span class="text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-red-600">Projects</span>
        </h2>
      </div>
      <p class="mt-6 text-gray-500 max-w-2xl mx-auto text-lg">Crafting digital experiences that merge innovation with purpose</p>
    </div>

    <!-- Advanced Filter Buttons -->
    <div class="flex justify-center mb-16">
      <div class="inline-flex bg-gray-100 rounded-full p-1">
        <button *ngFor="let filter of filters" 
                class="px-5 py-2 text-sm font-medium rounded-full transition-all"
                [class.bg-white]="activeFilter === filter.id"
                [class.text-red-600]="activeFilter === filter.id"
                [class.shadow-md]="activeFilter === filter.id"
                [class.text-gray-600]="activeFilter !== filter.id"
                (click)="setFilter(filter.id)">
          {{filter.label}}
        </button>
      </div>
    </div>

    <!-- Loading Skeleton -->
    <div *ngIf="isLoading" class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <div *ngFor="let _ of skeletonItems" class="border border-gray-100 rounded-2xl overflow-hidden animate-pulse">
        <div class="h-48 bg-gray-200"></div>
        <div class="p-6 space-y-4">
          <div class="h-6 bg-gray-200 rounded w-3/4"></div>
          <div class="flex justify-between">
            <div class="h-4 bg-gray-200 rounded w-1/4"></div>
            <div class="h-4 bg-gray-200 rounded w-1/4"></div>
          </div>
          <div class="h-16 bg-gray-200 rounded"></div>
          <div class="flex flex-wrap gap-2">
            <div *ngFor="let _ of [].constructor(3)" class="h-6 bg-gray-200 rounded-full w-16"></div>
          </div>
          <div class="flex gap-3 pt-4">
            <div class="h-10 bg-gray-200 rounded-lg w-full"></div>
            <div class="h-10 bg-gray-200 rounded-lg w-full"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Projects Grid with Lazy Loading -->
    <div #projectsContainer class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <div *ngFor="let project of visibleProjects; trackBy: trackById" 
           class="project-card group relative overflow-hidden rounded-2xl bg-white border border-gray-100 shadow-sm hover:shadow-lg transition-all duration-300">
        
        <!-- Lazy Loaded Image with Gradient Overlay -->
        <div class="h-48 relative overflow-hidden">
          <img [src]="project.imageUrl" 
     [alt]="project.name"
     class="absolute inset-0 w-full h-full object-cover">

          <!-- <div *ngIf="!imageLoaded[project.id]" class="absolute inset-0 bg-gray-200 animate-pulse"></div> -->
          <div class="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent"></div>
          <div class="absolute top-4 right-4">
            <span *ngIf="project.featured" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-gradient-to-r from-red-500 to-red-600 text-white shadow-md">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
              </svg>
              Featured
            </span>
          </div>
        </div>
        
        <!-- Project Content -->
        <div class="p-6">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-xl font-bold text-gray-900">{{project.name}}</h3>
            <span class="text-xs font-medium px-2 py-1 rounded-full bg-gray-100 text-gray-600">{{project.year}}</span>
          </div>
          
          <p class="text-gray-500 mb-5">{{project.description}}</p>
          
          <!-- Tech Stack -->
          <div class="mb-6">
            <div class="flex flex-wrap gap-2">
              <span *ngFor="let tech of project.techStack" 
                    class="text-xs px-3 py-1.5 bg-gray-50 text-gray-600 rounded-full border border-gray-200 hover:bg-red-50 hover:text-red-600 hover:border-red-100 transition-colors">
                {{tech}}
              </span>
            </div>
          </div>
          
          <!-- Action Buttons -->
          <div class="flex items-center gap-3">
            <a [href]="project.githubLink" target="_blank" 
               class="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors text-sm font-medium">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
              </svg>
              View Code
            </a>
            
            <a *ngIf="project.liveLink" [href]="project.liveLink" target="_blank"
               class="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 bg-gradient-to-r from-red-500 to-red-600 text-white rounded-lg hover:from-red-600 hover:to-red-700 transition-all text-sm font-medium shadow-sm hover:shadow-md">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
              </svg>
              Live Demo
            </a>
            
            <a *ngIf="!project.liveLink" 
               class="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 bg-gray-100 text-gray-400 rounded-lg cursor-not-allowed text-sm font-medium">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
              Private
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Load More Button -->
    <div *ngIf="hasMoreProjects && !isLoading" class="mt-12 text-center">
      <button (click)="loadMore()" 
              class="px-6 py-3 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md transition-all font-medium text-gray-700 hover:bg-gray-50">
        Load More Projects
      </button>
    </div>
  </div>
</div>
